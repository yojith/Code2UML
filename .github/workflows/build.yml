name: Build extension artifact

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --extra dev --frozen
      - run: uv run --frozen --extra dev python -m black --check src/python2uml tests/python
      - run: uv run --frozen --extra dev python -m pytest -v
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run build:runtime:win32-x64 -- -BuildPython "${{ env.pythonLocation }}\python.exe"
      - run: npm run package -- --target win32-x64 --out python2uml-win32-x64-${{ github.sha }}.vsix
      - name: Inspect VSIX
        shell: pwsh
        run: |
          $vsix = "python2uml-win32-x64-${{ github.sha }}.vsix"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = $null
          try {
            $archive = [IO.Compression.ZipFile]::OpenRead($vsix)
            $entryNames = @($archive.Entries.FullName)
            $requiredFiles = @(
              'extension/out/src/extension.js'
              'extension/python-runtime/python.exe'
              'extension/python-runtime/Lib/site-packages/python2uml/__init__.py'
              'extension/graphviz/bin/dot.exe'
              'extension/licenses/python/LICENSE.txt'
              'extension/licenses/graphviz/LICENSE'
              'extension/THIRD_PARTY_NOTICES.md'
            )
            foreach ($entry in $requiredFiles) {
              if ($entryNames -cnotcontains $entry) {
                throw "Missing required VSIX entry: $entry"
              }
            }
            foreach ($prefix in 'extension/graphviz/lib/', 'extension/graphviz/share/') {
              if (-not ($entryNames | Where-Object { $_.StartsWith($prefix, [StringComparison]::Ordinal) })) {
                throw "Missing required VSIX prefix: $prefix"
              }
            }
            $forbidden = foreach ($name in $entryNames) {
              $components = $name.Split('/')
              if ($components | Where-Object { '.venv', '.git', '__pycache__', 'tests' -ccontains $_ }) {
                $name
                continue
              }
              if ($name.StartsWith('extension/python-runtime/Lib/site-packages/', [StringComparison]::Ordinal)) {
                foreach ($component in $components[4..($components.Count - 1)]) {
                  if (('black', 'pytest', '_pytest' -ccontains $component) -or $component -cmatch '^(black|pytest|_pytest)-[^/]+\.(dist-info|data)$') {
                    $name
                    break
                  }
                }
              }
            }
            if ($forbidden) {
              throw "Forbidden VSIX entries:`n$($forbidden -join "`n")"
            }
          } finally {
            if ($archive) { $archive.Dispose() }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: python2uml-win32-x64-vsix-${{ github.sha }}
          path: python2uml-win32-x64-${{ github.sha }}.vsix
          if-no-files-found: error

name: Build extension artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run build:runtime:win32-x64
      - run: npm run package -- --target win32-x64 --out python2uml-win32-x64-${{ github.sha }}.vsix
      - name: Inspect VSIX
        shell: pwsh
        run: ./scripts/verify-windows-vsix.ps1 "python2uml-win32-x64-${{ github.sha }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: python2uml-win32-x64-vsix-${{ github.sha }}
          path: python2uml-win32-x64-${{ github.sha }}.vsix
          if-no-files-found: error

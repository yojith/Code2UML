name: Build extension artifact

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies --out python2uml-${{ github.sha }}.vsix

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python2uml-vsix-${{ github.sha }}
          path: python2uml-${{ github.sha }}.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath python2uml-${{ github.sha }}.vsix

name: Build extension artifact

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run package -- --out python2uml-${{ github.sha }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: python2uml-vsix-${{ github.sha }}
          path: python2uml-${{ github.sha }}.vsix
          if-no-files-found: error

name: Build extension artifact

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[dev]"
      - run: python -m black --check src/python2uml tests/python
      - run: python -m pytest -v
      - run: npm run compile
      - run: npm run lint
      - run: xvfb-run -a npm test

      - name: Package extension
        run: npm run package -- --out python2uml-${{ github.sha }}.vsix

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python2uml-vsix-${{ github.sha }}
          path: python2uml-${{ github.sha }}.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath python2uml-${{ github.sha }}.vsix

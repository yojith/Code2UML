name: Release extension

on:
  release:
    types: [published]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, os: windows-latest }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-x64, os: macos-13 }
          - { target: darwin-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    environment: marketplace-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --extra dev --frozen
      - run: uv run --frozen --extra dev python -m black --check src/python2uml tests/python
      - run: uv run --frozen --extra dev python -m pytest -v
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run build:runtime:${{ matrix.target }}
      - run: npm run package -- --target ${{ matrix.target }} --out python2uml-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix
      - name: Inspect VSIX
        shell: pwsh
        run: ./scripts/verify-vsix.ps1 "python2uml-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix" "${{ matrix.target }}"
      - name: Attach VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "python2uml-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix" --clobber
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath python2uml-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix --azure-credential

name: Release extension

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: windows-latest
    environment: marketplace-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --extra dev --frozen
      - run: uv run --frozen --extra dev python -m black --check src/python2uml tests/python
      - run: uv run --frozen --extra dev python -m pytest -v
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run build:runtime:win32-x64
      - name: Smoke test bundled draw.io layout
        shell: pwsh
        run: |
          $env:EXTENSION_GRAPHVIZ_DOT = (Resolve-Path graphviz\bin\dot.exe)
          $env:PATH = "$(Split-Path $env:EXTENSION_GRAPHVIZ_DOT);$env:PATH"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          & .\python-runtime\python.exe -m python2uml -t python -o smoke.drawio -p tests\fixtures\python\project1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke.drawio)) { throw 'Bundled draw.io layout smoke test failed.' }
      - run: npm run package -- --target win32-x64 --out python2uml-win32-x64-${{ github.event.release.tag_name }}.vsix
      - name: Inspect VSIX
        shell: pwsh
        run: ./scripts/verify-windows-vsix.ps1 "python2uml-win32-x64-${{ github.event.release.tag_name }}.vsix"
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath python2uml-win32-x64-${{ github.event.release.tag_name }}.vsix --azure-credentials ${{ secrets.AZURE_CREDENTIALS }}
